version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: uiux_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uiux_analyzer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: uiux_ai_service
    restart: unless-stopped
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - AI_PROVIDER=ollama
      - OLLAMA_VISION_MODEL=llava
      - OLLAMA_TEXT_MODEL=llama3
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uiux_backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:5173
      - AI_SERVICE_URL=http://ai-service:8000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/uiux_analyzer?schema=public
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - ai-service
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uiux_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
